<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detecção de Objetos e Fala</title>
    <link rel="stylesheet" href="camera.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-vis"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <!-- Se você exportar um modelo TFJS coloque em dataset/model/model.json -->
    <!-- ONNX Runtime Web para carregar modelos .onnx no navegador -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <!-- OVERRIDE: botões na parte inferior, horizontais -->
    <style>
      /* Container dos botões na parte inferior */
      #controls {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom) + 12px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: clamp(10px, 3vw, 20px);
        justify-content: center;
        align-items: center;
        padding: 0 12px;
        z-index: 20;
        width: calc(100% - 24px);
        max-width: 1200px;
        flex-wrap: wrap;
      }

      /* estilo base para botões */
      #controls .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: none;
        cursor: pointer;
        color: #fff;
        transition: transform .12s ease, box-shadow .12s ease;
        font-weight: 700;
        flex: 1;
        min-width: 140px;
        max-width: 380px;
        border-radius: 16px;
        padding: clamp(14px, 2.5vh, 22px) clamp(18px, 3vw, 32px);
        font-size: clamp(15px, 3.5vw, 22px);
      }

      /* botão Identificar: roxo */
      #identify-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        box-shadow: 0 12px 30px rgba(102, 126, 234, 0.28);
      }

      /* botão Perguntar: rosa/vermelho */
      #ask-btn {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        box-shadow: 0 12px 30px rgba(245, 87, 108, 0.28);
      }

      /* botão Dicas: azul claro */
      #tips-btn {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        box-shadow: 0 12px 30px rgba(79, 172, 254, 0.28);
      }

      /* hover/active */
      #controls .btn:hover:not(:disabled) { 
        transform: translateY(-4px) scale(1.02); 
        box-shadow: 0 18px 40px rgba(102, 126, 234, 0.36); 
      }
      #controls .btn:active:not(:disabled) { 
        transform: translateY(-1px) scale(0.995); 
      }

      /* responsividade */
      @media (max-width: 480px) {
        #controls { 
          gap: 8px; 
          padding: 0 8px;
        }
        #controls .btn {
          min-width: 110px;
          padding: 12px 14px;
          font-size: clamp(13px, 3vw, 18px);
        }
      }
    </style>
</head>
<body>
    <div class="app">
        <div id="webcam-container">
            <video id="video" playsinline autoplay></video>
            <div id="top-prediction" class="hidden" aria-live="polite"></div>
        </div>
        <div id="controls">
            <button id="identify-btn" class="btn primary">▶ Identificar</button>
            <button id="ask-btn" class="btn">❓ Perguntar</button>
            <button id="tips-btn" class="btn">💡 Dicas</button>
        </div>
    </div>
    <div id="detections" style="display:none"></div>
    
    <script src="camera.js"></script>
</body>
</html>
