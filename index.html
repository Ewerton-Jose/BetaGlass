<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Detecção • BetaGlass</title>
  <link rel="stylesheet" href="index.css" />
  <style>
    html, body { 
      height: 100%; 
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .app-wrapper{
      position:fixed; 
      inset:0; 
      display:block;
    }
    .stage{
      position:fixed; 
      inset:0; 
      padding:0; 
      margin:0;
    }
    /* Container em tela cheia com recorte (cover) sem distorcer */
    #webcam-container{
      position:fixed; 
      inset:0; 
      width:100vw; 
      height:100dvh; 
      overflow:hidden;
    }
    /* O tamanho do canvas será ajustado via JS para manter proporção (cover) */
    #webcam-container canvas{ 
      display:block; 
      border-radius:0; 
    }
    /* Botão central sobre o vídeo - GRANDE E HORIZONTAL 16:9 */
    .center-start{
      position:fixed; 
      inset:0; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      z-index:10;
      padding: 20px;
    }
    #startBtn{
      z-index:11;
      /* Botão grande e horizontal - forçar landscape */
      width: min(90vw, 90vh * 16/9);
      height: min(90vh, 90vw * 9/16);
      font-size: clamp(24px, 8vw, 64px);
      font-weight: 700;
      padding: 0;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      text-align: center;
      padding: 20px;
    }
    #startBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
    }
    #startBtn:active:not(:disabled) {
      transform: scale(0.98);
    }
    #startBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    /* Overlay da melhor predição */
    #top-prediction{
      position:fixed; 
      left:0; 
      bottom:calc(env(safe-area-inset-bottom) + 0px);
      width:100%; 
      background:rgba(0,0,0,.55);
      padding:10px 14px; 
      font-size:clamp(14px,4vw,18px); 
      font-weight:600;
      backdrop-filter:blur(2px); 
      z-index:9; 
      text-align:center;
      color: white;
    }
    .hidden{
      display:none !important;
    }
    /* Aviso de orientação */
    #orientation-warning {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    #orientation-warning.show {
      display: flex;
    }
    /* Forçar landscape em celulares */
    @media (max-aspect-ratio: 1/1) {
      html {
        transform: rotate(0deg);
      }
    }
  </style>
</head>
<body>
  <div id="orientation-warning">
    <p>📱 Por favor, vire seu celular para a horizontal</p>
  </div>
  
  <div class="app-wrapper">
    <main class="stage">
      <div id="webcam-container" aria-live="polite" aria-label="Visualização da câmera"></div>
      <div class="center-start"><button id="startBtn">▶ Começar Detecção</button></div>
      <div id="error" class="error" role="status" aria-live="assertive"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/5aXNg7B01/";
    let model, webcam, maxPredictions;
    const startBtn = document.getElementById('startBtn');
    const errorDiv = document.getElementById('error');
    const webcamContainer = document.getElementById('webcam-container');
    const orientationWarning = document.getElementById('orientation-warning');
    let topDiv;
    let audioPlayed = false;

    // Verificar orientação
    function checkOrientation() {
      const isLandscape = window.innerWidth > window.innerHeight;
      if (!isLandscape) {
        orientationWarning.classList.add('show');
      } else {
        orientationWarning.classList.remove('show');
      }
    }

    // Monitorar mudanças de orientação
    window.addEventListener('orientationchange', () => {
      setTimeout(checkOrientation, 100);
    });

    window.addEventListener('resize', () => {
      checkOrientation();
    });

    // Reproduzir áudio de boas-vindas
    function playWelcomeAudio() {
      if (audioPlayed) return;
      audioPlayed = true;

      const utterance = new SpeechSynthesisUtterance();
      utterance.text = 'Seja bem vindo! Ponha o celular na horizontal e foque em poucos objetos';
      utterance.lang = 'pt-BR';
      utterance.rate = 0.95;
      utterance.pitch = 1;
      utterance.volume = 1;

      window.speechSynthesis.speak(utterance);
    }

    function sizeCanvasCover(){
      if (!webcam || !webcam.canvas) return;
      const canvas = webcam.canvas;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let vidW = 640, vidH = 480;
      try {
        const v = webcam.webcam || webcam.video || null;
        if (v && v.videoWidth && v.videoHeight) { vidW = v.videoWidth; vidH = v.videoHeight; }
      } catch {}
      const arVideo = vidW / vidH;
      const arViewport = vw / vh;
      if (arViewport > arVideo) {
        canvas.style.width = vw + 'px';
        canvas.style.height = 'auto';
      } else {
        canvas.style.height = vh + 'px';
        canvas.style.width = 'auto';
      }
      canvas.style.position = 'absolute';
      canvas.style.top = '50%';
      canvas.style.left = '50%';
      canvas.style.transform = 'translate(-50%, -50%)';
    }

    async function init(){
      startBtn.classList.add('hidden');
      errorDiv.textContent = '';
      
      // Reproduzir áudio de boas-vindas
      playWelcomeAudio();
      
      // Verificar orientação
      checkOrientation();

      try {
        model = await tmImage.load(URL + 'model.json', URL + 'metadata.json');
        maxPredictions = model.getTotalClasses();
        const flip = false;
        webcam = new tmImage.Webcam(640, 480, flip);
        await webcam.setup({ facingMode: { exact: "environment" } });
        await webcam.play();
        window.requestAnimationFrame(loop);
        webcamContainer.appendChild(webcam.canvas);
        topDiv = document.createElement('div');
        topDiv.id = 'top-prediction';
        webcamContainer.appendChild(topDiv);
        sizeCanvasCover();
        window.addEventListener('resize', sizeCanvasCover);
        window.addEventListener('orientationchange', sizeCanvasCover);
        validateBackCamera();
      } catch(err){
        startBtn.classList.remove('hidden');
        if (err && err.name === 'NotAllowedError') {
          errorDiv.textContent = 'Permissão negada: autorize o uso da câmera.';
        } else if (err && (err.name === 'NotFoundError' || err.name === 'OverconstrainedError')) {
          errorDiv.textContent = 'Câmera traseira não disponível neste dispositivo.';
        } else {
          errorDiv.textContent = 'Erro ao inicializar: ' + (err.message || err);
        }
      }
    }

    async function loop(){
      webcam.update();
      await predictTop();
      window.requestAnimationFrame(loop);
    }

    async function predictTop(){
      const prediction = await model.predict(webcam.canvas);
      let best = prediction[0];
      for (let i=1;i<prediction.length;i++){
        if (prediction[i].probability > best.probability){
          best = prediction[i];
        }
      }
      topDiv.textContent = `${best.className} (${(best.probability*100).toFixed(1)}%)`;
    }

    startBtn.addEventListener('click', () => {
      window.location.href = 'yolo/camera.html';
    });

    async function validateBackCamera(){
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoInputs = devices.filter(d => d.kind === 'videoinput');
        const backLike = videoInputs.find(d => /back|rear|environment|traseira/i.test(d.label));
        if (!backLike && videoInputs.length > 1){
          errorDiv.textContent = 'Aviso: usando outra câmera (traseira não identificada).';
        }
      } catch(e){ /* silencioso */ }
    }

    // Iniciar quando a página carrega
    window.addEventListener('load', init);
  </script>
</body>
</html>
