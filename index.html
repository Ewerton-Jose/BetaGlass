<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Detecção • BetaGlass</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="orientation-warning">
    <p>📱 Por favor, vire seu celular para a horizontal</p>
  </div>
  
  <div class="app-wrapper">
    <main class="stage">
      <div id="webcam-container" aria-live="polite" aria-label="Visualização da câmera"></div>
      <div class="center-start"><button id="startBtn">▶ Começar Detecção</button></div>
      <div id="error" class="error" role="status" aria-live="assertive"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
