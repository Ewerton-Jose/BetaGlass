<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Detection Test - BetaGlass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        
        .upload-section input {
            display: none;
        }
        
        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .upload-info {
            color: #999;
            font-size: 12px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        
        .preview-section {
            display: none;
            margin-bottom: 30px;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .preview-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .canvas-container {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
        }
        
        #previewImage,
        #canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        
        #canvas {
            border: 2px solid #667eea;
        }
        
        .results-section {
            display: none;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .results-section.active {
            display: block;
        }
        
        .results-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .detection-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .detection-class {
            font-weight: 600;
            color: #333;
        }
        
        .detection-confidence {
            color: #667eea;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .detection-coords {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .status.active {
            display: block;
        }
        
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #1976d2;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border: 1px solid #388e3c;
        }
        
        .status.error {
            background: #ffebee;
            color: #d32f2f;
            border: 1px solid #d32f2f;
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .no-detections {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 YOLO Detection Test</h1>
        <p class="subtitle">BetaGlass - Teste de Detecção de Objetos</p>
        
        <div class="status loading" id="loadingStatus">
            <span class="spinner"></span>
            Carregando modelo YOLO (ONNX)...
        </div>
        
        <div class="status error" id="errorStatus" style="display: none;"></div>
        
        <div class="upload-section" id="uploadSection">
            <div class="upload-text">📤 Clique ou arraste uma imagem</div>
            <div class="upload-info">Suporte: JPG, PNG (máx 10MB)</div>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <div class="button-group">
            <button class="btn-primary" id="detectBtn" disabled>
                🔍 Detectar Objetos
            </button>
            <button class="btn-secondary" id="clearBtn">
                🗑️ Limpar
            </button>
        </div>
        
        <div class="preview-section" id="previewSection">
            <div class="preview-title">Imagem Original:</div>
            <div class="canvas-container">
                <img id="previewImage" alt="Preview">
            </div>
        </div>
        
        <div class="preview-section" id="detectionSection">
            <div class="preview-title">Resultado da Detecção:</div>
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
        
        <div class="results-section" id="resultsSection">
            <div class="results-title">📊 Detecções encontradas:</div>
            <div id="detectionsList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@latest/dist/ort.all.min.js"></script>
    <script>
        let imageFile = null;
        let session = null;
        const CONFIDENCE_THRESHOLD = 0.5;

        // Inicializar modelo YOLO
        async function initModel() {
            try {
                const statusEl = document.getElementById('loadingStatus');
                statusEl.classList.add('active');
                
                // Carregar o modelo ONNX
                const modelPath = '/dataset3/model.onnx';
                session = await ort.InferenceSession.create(modelPath);
                
                statusEl.classList.remove('active');
                document.getElementById('detectBtn').disabled = false;
                
                console.log('✅ Modelo YOLO carregado com sucesso!');
            } catch (error) {
                console.error('❌ Erro ao carregar modelo:', error);
                showError(`Erro ao carregar modelo: ${error.message}`);
            }
        }

        // Upload de imagem
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                imageFile = file;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        document.getElementById('previewImage').src = img.src;
                        document.getElementById('previewSection').classList.add('active');
                        document.getElementById('detectBtn').disabled = false;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Drag and drop
        const uploadSection = document.getElementById('uploadSection');
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.style.borderColor = '#764ba2';
            uploadSection.style.background = '#f0f1ff';
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.style.borderColor = '#667eea';
            uploadSection.style.background = '#f8f9fa';
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                document.getElementById('imageInput').files = e.dataTransfer.files;
                document.getElementById('imageInput').dispatchEvent(new Event('change'));
            }
        });

        // Detectar objetos
        document.getElementById('detectBtn').addEventListener('click', async () => {
            if (!imageFile || !session) return;

            const detectBtn = document.getElementById('detectBtn');
            detectBtn.disabled = true;
            detectBtn.innerHTML = '<span class="spinner"></span>Analisando...';

            try {
                const img = new Image();
                img.onload = async () => {
                    await runDetection(img);
                    detectBtn.disabled = false;
                    detectBtn.innerHTML = '🔍 Detectar Objetos';
                };
                img.src = URL.createObjectURL(imageFile);
            } catch (error) {
                console.error('❌ Erro na detecção:', error);
                showError(`Erro na detecção: ${error.message}`);
                detectBtn.disabled = false;
                detectBtn.innerHTML = '🔍 Detectar Objetos';
            }
        });

        // Executar detecção
        async function runDetection(img) {
            try {
                // Preparar imagem (640x640 é o padrão YOLO)
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 640;
                const ctx = canvas.getContext('2d');
                
                const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                const x = (canvas.width - img.width * scale) / 2;
                const y = (canvas.height - img.height * scale) / 2;
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, x, y, img.width * scale, img.height * scale);

                // Converter para tensor
                const imageData = ctx.getImageData(0, 0, 640, 640);
                const tensor = new ort.Tensor('float32', 
                    preprocessImage(imageData.data), 
                    [1, 3, 640, 640]
                );

                // Inferência
                const results = await session.run({ images: tensor });
                
                // Processar resultados
                const detections = processResults(results, img);
                
                // Desenhar resultados
                drawDetections(img, detections);
                
                // Mostrar detecções
                showDetections(detections);

            } catch (error) {
                console.error('Erro na detecção:', error);
                throw error;
            }
        }

        // Pré-processar imagem
        function preprocessImage(data) {
            const processed = new Float32Array(3 * 640 * 640);
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i] / 255.0;
                const g = data[i + 1] / 255.0;
                const b = data[i + 2] / 255.0;
                
                processed[i / 4] = r;
                processed[(i / 4) + (640 * 640)] = g;
                processed[(i / 4) + (640 * 640 * 2)] = b;
            }
            return processed;
        }

        // Processar resultados YOLO
        function processResults(results, img) {
            const detections = [];
            // Aqui você processaria a saída do modelo YOLO
            // Por enquanto, retornando array vazio
            return detections;
        }

        // Desenhar detecções na imagem
        function drawDetections(img, detections) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.width;
            canvas.height = img.height;
            
            ctx.drawImage(img, 0, 0);
            
            detections.forEach(det => {
                const { x, y, width, height, class: className, confidence } = det;
                
                ctx.strokeStyle = '#FF6B6B';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, width, height);
                
                ctx.fillStyle = '#FF6B6B';
                ctx.font = 'bold 14px Arial';
                const text = `${className} ${(confidence * 100).toFixed(1)}%`;
                const textMetrics = ctx.measureText(text);
                const textHeight = 20;
                
                ctx.fillRect(x, y - textHeight, textMetrics.width + 8, textHeight);
                ctx.fillStyle = '#fff';
                ctx.fillText(text, x + 4, y - 5);
            });
            
            document.getElementById('detectionSection').classList.add('active');
        }

        // Mostrar detecções na lista
        function showDetections(detections) {
            const resultsList = document.getElementById('detectionsList');
            const resultsSection = document.getElementById('resultsSection');
            
            if (detections.length === 0) {
                resultsList.innerHTML = '<div class="no-detections">Nenhum objeto detectado</div>';
            } else {
                resultsList.innerHTML = detections.map((det, i) => `
                    <div class="detection-item">
                        <span class="detection-class">${det.class}</span>
                        <span class="detection-confidence">${(det.confidence * 100).toFixed(2)}%</span>
                        <div class="detection-coords">
                            Posição: (${det.x.toFixed(0)}, ${det.y.toFixed(0)}) 
                            Tamanho: ${det.width.toFixed(0)}x${det.height.toFixed(0)}
                        </div>
                    </div>
                `).join('');
            }
            
            resultsSection.classList.add('active');
        }

        // Limpar
        document.getElementById('clearBtn').addEventListener('click', () => {
            imageFile = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewSection').classList.remove('active');
            document.getElementById('detectionSection').classList.remove('active');
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('detectBtn').disabled = true;
        });

        // Mostrar erro
        function showError(message) {
            const errorEl = document.getElementById('errorStatus');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('active');
            setTimeout(() => errorEl.classList.remove('active'), 5000);
        }

        // Inicializar ao carregar
        window.addEventListener('load', initModel);
    </script>
</body>
</html>
